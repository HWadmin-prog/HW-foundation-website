backend:
  name: github
  repo: HWadmin-prog/HW-foundation-website   
  branch: main
  base_url: https://openbms-cms-auth.vercel.app   # <-- the OAuth helper URL (set up in Part 2)
  auth_endpoint: api/auth

publish_mode: simple
media_folder: "src/images"
public_folder: "/images"

collections:
  - name: "articles"
    label: "Articles"
    folder: "src/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{title}} — {{date}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - { label: "Technical", value: "technical" }
          - { label: "Project", value: "project" }
          - { label: "Imagination", value: "imagine" }
      - label: "Category label (shown on the site)"
        name: "categoryLabel"
        widget: "select"
        options: ["Technical", "Project", "Imagination"]
      - { label: "Sub-category (optional, e.g. Equipment)", name: "subCategory", widget: "string", required: false }
      - { label: "Thumbnail colour (hue 0–360)", name: "hue", widget: "number", default: 140 }
      - { label: "Read time (minutes)", name: "readTime", widget: "number", default: 5 }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Tags", name: "tags", widget: "list" }
      - { label: "Author", name: "author", widget: "string", default: "Kevin Williams" }
      - { label: "Author role", name: "authorRole", widget: "string", default: "Hurtwood Ltd — BMS Strategy" }
      - { label: "Author initial", name: "authorInitial", widget: "string", default: "K" }
      - { label: "Body", name: "body", widget: "markdown" }
